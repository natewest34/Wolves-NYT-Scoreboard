name: Finalize Daily Scores

on:
  schedule:
    # 06:15 UTC = 12:15am CST / 1:15am CDT — after local midnight in River Falls, WI year-round
    - cron: '15 6 * * *'
  workflow_dispatch: {}

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Finalize any unfinalized past days
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          SUBMISSIONS_BIN_ID: ${{ secrets.SUBMISSIONS_BIN_ID }}
        run: node scripts/finalize-day.mjs
