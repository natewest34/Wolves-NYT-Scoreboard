name: Apply Write

on:
  repository_dispatch:
    types: [nyt-write]

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply the requested write
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          SUBMISSIONS_BIN_ID: ${{ secrets.SUBMISSIONS_BIN_ID }}
          ACTION: ${{ github.event.client_payload.action }}
          PAYLOAD: ${{ toJson(github.event.client_payload.payload) }}
        run: node scripts/apply-write.mjs
